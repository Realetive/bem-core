name: CI

on:
  push:
    branches: [master, v*]
  pull_request:
    branches: [master, v5]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test

  test-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # S0 verification fence (spec bc-gdk9 / bc-ysp7):
      # bundle gate (gz caps + allowlist/baseline ratchets, staged final
      # assertions), platform-entry freshness diff, CONST-P6 baseline check,
      # CONST-P1 bidirectional ratchet + final predicate (skip/preview),
      # doc-parity fence.
      - run: node build/check-bundle-size.mjs
      - run: node build/generate-platform-entries.mjs && git diff --exit-code -- build/platforms/
      - run: bash specs/check-platform-baseline.sh
      - run: bash specs/check-jquery-ratchet.sh
      - run: node build/check-doc-parity.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs
      - uses: actions/upload-artifact@v4
        with:
          name: jsdoc
          path: docs/jsdoc/
